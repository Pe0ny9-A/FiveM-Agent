[project]
name = "xuanji"
version = "0.4.0"
description = "玄玑 · FiveM 智能体内核（Capability/Body/Memory/Knowledge/Neural/Gate/Ensemble）"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Xiaobao" }]
license = { text = "MIT" }
keywords = ["fivem", "qbcore", "ox_lib", "ai-agent", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "anyio>=4.6.0",
    "rich>=13.9.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
    "platformdirs>=4.9.6",
    "jieba>=0.42.1",
    "fastapi>=0.136.3",
    "uvicorn>=0.48.0",
    "websockets>=12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
xuanji = "core.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# RUF001/002/003: 中文全角标点在中文项目里是合法的，不视为歧义
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# typer 的标准模式就是在函数默认值里写 typer.Option(...) / typer.Argument(...)
"core/cli.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_unimported = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["jieba", "jieba.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
