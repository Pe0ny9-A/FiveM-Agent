[package]
name = "xuanji-desktop"
version = "0.3.0"
description = "玄玑 · FiveM 智能体桌面端"
authors = ["Xiaobao"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.75"

[lib]
name = "xuanji_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
